
name: Build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64

          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            name: windows-arm64

          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x86_64

          - os: macos-14
            target: aarch64-apple-darwin
            name: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-release
          path: |
            target/${{ matrix.target }}/release/papear
            target/${{ matrix.target }}/release/papear.exe
